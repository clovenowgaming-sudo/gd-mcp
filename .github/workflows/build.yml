name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: false
          target: Android64
          sdk: v5.11.2
          ccache-variant: ''
          android-min-sdk: 24

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_DIR: ${{ steps.build.outputs.build-output }}
        run: |
          set -e
          FILE=$(find "$OUT_DIR" -name '*.geode' | head -n 1)
          echo "Built: $FILE"
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Build #${GITHUB_RUN_NUMBER}" \
            --notes "Auto build from ${GITHUB_SHA}"
